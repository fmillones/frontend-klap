<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagos · Elige tu medio de pago</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{ --navy:#0d1b4c; --green:#00b58a; --red:#c0392b; }
  body{ background:#fff; color:var(--navy); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }

  /* Barra superior con el selector de modo */
  .barra{ border-bottom:1px solid #e6e9f2; padding:.9rem 0; }
  .titulo{ font-weight:900; font-size:1.25rem; margin:0; }
  .modo{ display:inline-flex; background:#eef1f7; border-radius:14px; padding:4px; gap:4px; }
  .modo-btn{ border:0; background:transparent; color:var(--navy); font-weight:800; padding:.55rem 1.3rem; border-radius:10px; }
  .modo-btn.activo[data-modo="test"]{ background:var(--green); color:#fff; }
  .modo-btn.activo[data-modo="prod"]{ background:var(--red); color:#fff; }
  .aviso-prod{ background:#fdecea; color:var(--red); border-radius:12px; padding:.6rem 1rem; font-weight:700; text-align:center; }

  .subtitulo{ text-align:center; font-weight:700; margin:2rem 0 1.2rem; }

  /* Cuadros con logo */
  .medio{
    width:100%; background:#fff; border:3px solid #e6e9f2; border-radius:20px; padding:1rem;
    text-align:center; cursor:pointer; transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  .medio:hover{ transform:translateY(-3px); border-color:var(--navy); box-shadow:0 10px 24px rgba(13,27,76,.12); }
  .logo{
    display:flex; align-items:center; justify-content:center; height:110px; padding:.8rem;
    border-radius:12px; border:1px solid #e6e9f2; background:#fff;
  }
  .logo img{ max-width:100%; max-height:100%; object-fit:contain; }
  .logo-fallback{ display:none; align-items:center; justify-content:center; font-weight:900; font-size:1.3rem; color:var(--navy); }
  .nombre{ display:block; margin-top:.8rem; font-weight:800; color:var(--navy); }
</style>
</head>
<body>

<div class="barra">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h1 class="titulo">Pagos en línea</h1>
    <div class="modo" role="group" aria-label="Modo">
      <button type="button" class="modo-btn activo" data-modo="test" aria-pressed="true">Test</button>
      <button type="button" class="modo-btn" data-modo="prod" aria-pressed="false">Producción</button>
    </div>
  </div>
</div>

<main class="container pb-5">
  <div id="avisoProd" class="aviso-prod mt-3 d-none">Modo PRODUCCIÓN: los pagos serán reales.</div>

  <p class="subtitulo">Elige tu medio de pago</p>

  <div class="row g-3">
    <div class="col-6 col-md-3">
      <button type="button" class="medio" data-tienda="transbank_mall">
        <span class="logo">
          <img src="logos/transbank.png" alt="Transbank" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <span class="logo-fallback">Transbank</span>
        </span>
        <span class="nombre">Webpay Completa</span>
      </button>
    </div>
    <div class="col-6 col-md-3">
      <button type="button" class="medio" data-tienda="transbank_plus">
        <span class="logo">
          <img src="logos/transbank.png" alt="Transbank" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <span class="logo-fallback">Transbank</span>
        </span>
        <span class="nombre">Webpay Plus</span>
      </button>
    </div>
    <div class="col-6 col-md-3">
      <button type="button" class="medio" data-tienda="klap">
        <span class="logo">
          <img src="logos/klap.png" alt="Klap" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <span class="logo-fallback">Klap</span>
        </span>
        <span class="nombre">Klap</span>
      </button>
    </div>
    <div class="col-6 col-md-3">
      <button type="button" class="medio" data-tienda="pagonxt">
        <span class="logo">
          <img src="logos/pagonxt.png" alt="Pagonxt" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <span class="logo-fallback">Pagonxt</span>
        </span>
        <span class="nombre">Pagonxt</span>
      </button>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
